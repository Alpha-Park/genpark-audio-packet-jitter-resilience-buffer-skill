[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-jitter-buffer"
version = "1.0.1"
description = "Packet ordering simulation and inter-arrival jitter telemetry."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GenPark AI Engineering"}]
dependencies = []
keywords = ["genpark", "mcp", "ai-agent", "python"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/Alpha-Park/genpark-audio-packet-jitter-resilience-buffer-skill"
Documentation = "https://github.com/Alpha-Park/genpark-audio-packet-jitter-resilience-buffer-skill#readme"
Issues = "https://github.com/Alpha-Park/genpark-audio-packet-jitter-resilience-buffer-skill/issues"
Homepage = "https://genpark.ai/mcp"

[project.scripts]
genpark-jitter-buffer = "genpark_jitter_buffer.server:main"

[tool.setuptools.packages.find]
include = ["genpark_jitter_buffer*"]
